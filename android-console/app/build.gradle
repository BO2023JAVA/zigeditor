// 纯终端 APK 宿主：只加载 libmicrozig.so（由端上构建替换），不含 SDL / UI 框架。
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.libsdl.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.libsdl.app'
        // System.loadLibrary + JNI，API 24 起足够
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError = false
    }
}
